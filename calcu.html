<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <input type="number" placeholder="value1" id="value1_inp">

    <select name="" id="operation_sel">
        <option value="add">Add</option>
        <option value="subtract">Subtract</option>
        <option value="multiply">Multiply</option>
        <option value="divide">Divide</option>
    </select>

    <input type="number" placeholder="value2" id="value2_inp"> 



    <body style="font-family:Arial; background:#f1f1f1; min-height:100vh; display:flex; justify-content:center; align-items:center; margin:0;">

    <div style="background:white; padding:20px; width:280px; border-radius:15px;">

        <h2 style="color:green;"> WIC</h2>

        <input id="display" value="0" readonly
        style="width:95%; padding:12px 0; text-align:right; font-size:30px; margin-bottom:15px;">

        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;">

            <button onclick="clearDisplay()" style="color:yellow;">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="percentage()">%</button>
            <button onclick="chooseOperator('/')" style="color:green;">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="chooseOperator('*')" style="color:green;">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="chooseOperator('-')" style="color:green;">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="chooseOperator('+')" style="color:green;">+</button>

            <button onclick="toggleSign()">+/-</button>
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button onclick="calculate()" style="background:green;color:white;">=</button>

        </div>
    </div>

    <style>
        button {
            padding:15px 5px;
            border:0;
            border-radius:10px;
            font-size:18px;
            background:#eee;
            cursor:pointer;
        }
  </style>


    <script src="calu.js"></script>
</body>
</html>
